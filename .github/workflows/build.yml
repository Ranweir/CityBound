name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract both game ZIP parts and find project
        id: find
        shell: bash
        run: |
          set -euo pipefail

          # If project.godot is already in the repository root, use it.
          P=""
          if [ -f "./project.godot" ]; then
            P="./project.godot"
          else
            # Both parts contain different files; extract them into ONE directory.
            mkdir -p "_unzipped_game"

            shopt -s nullglob
            zips=(./CityBound_part*.zip ./CityBound_part*.ZIP)
            shopt -u nullglob

            if [ "${#zips[@]}" -eq 0 ]; then
              echo "ERROR: CityBound_part1.zip and CityBound_part2.zip were not found in the repository root."
              exit 1
            fi

            for z in "${zips[@]}"; do
              echo "Extracting: $z"
              unzip -oq "$z" -d "_unzipped_game"
            done

            P=$(find "_unzipped_game" -type f -name project.godot -print -quit)
          fi

          if [ -z "$P" ]; then
            echo "ERROR: project.godot not found after extracting the ZIP parts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$P")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Godot project found at: $PROJECT_DIR"

          # Confirm that the motorbike model and script are present.
          test -f "$PROJECT_DIR/assets/bike/nrg500.glb" || { echo "ERROR: NRG-500 model missing."; exit 1; }
          test -f "$PROJECT_DIR/scripts/bike.gd" || { echo "ERROR: bike script missing."; exit 1; }
          # Ensure removed vehicle models are not accidentally included.
          test ! -e "$PROJECT_DIR/assets/car" || { echo "ERROR: car assets still present."; exit 1; }
          test ! -e "$PROJECT_DIR/assets/truck" || { echo "ERROR: truck assets still present."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.3 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Create debug keystore and configure Godot
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          godot --headless --path . --editor --quit || true
          ls -la "$HOME/.config/godot" || true
          if ! ls "$HOME"/.config/godot/editor_settings-*.tres > /dev/null 2>&1; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$HOME/.config/godot/editor_settings-4.3.tres"
          fi
          for f in "$HOME"/.config/godot/editor_settings-*.tres; do
            {
              echo "export/android/android_sdk_path = \"$SDK\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo "export/android/debug_keystore_user = \"androiddebugkey\""
              echo "export/android/debug_keystore_pass = \"android\""
              echo "export/android/force_system_user = false"
              echo "export/android/shutdown_adb_on_exit = true"
            } >> "$f"
            echo "Settings updated: $f"
          done

      - name: Import assets
        working-directory: ${{ steps.find.outputs.dir }}
        run: godot --headless --path . --import

      - name: Export APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" "$PWD/build/CityBound.apk"
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: CityBound-apk
          path: ${{ steps.find.outputs.dir }}/build/CityBound.apk
